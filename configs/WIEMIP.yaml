# WIEMIP Extension Configuration
# ===============================
# Extends ScenarioMIP default with a counterfactual LN scenario (LN-CF)
# where emissions are adjusted so that FaIR median temperatures hold steady
# at the peak level (around 2080).

name: WIEMIP
description: >
  ScenarioMIP markers plus HL-CF counterfactual.
  HL-CF departs from the HL pathway at 2080 and is optimized to hold
  FaIR median temperature constant at the 2080 peak level.

# --- Time range constants ---
time:
  historical_start_year: 1900
  future_start_year: 2023.0
  scenario_end_year: 2100
  extensions_end_year: 2500

# --- Flags ---
flags:
  make_plots: false
  dump_csvs: true

# --- Plot colors per marker (for FaIR result visualizations) ---
plot_colors:
  HL: "#E744F6"
  H: "#a41212"
  M: "#fc7b03"
  ML: "#dec820"
  L: "#20A359"
  LN: "#22e5db"
  VL: "#16188F"
  HL-CF: "#FF6600"

# --- Scenario-to-model mapping ---
scenario_model_match:
  VL:
    scenario: "SSP1 - Very Low Emissions"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "tab:blue"
  LN:
    scenario: "SSP2 - Low Overshoot_a"
    model: "AIM 3.0"
    color: "tab:cyan"
  L:
    scenario: "SSP2 - Low Emissions"
    model: "MESSAGEix-GLOBIOM-GAINS 2.1-M-R12"
    color: "tab:green"
  ML:
    scenario: "SSP2 - Medium-Low Emissions"
    model: "COFFEE 1.6"
    color: "tab:pink"
  M:
    scenario: "SSP2 - Medium Emissions"
    model: "IMAGE 3.4"
    color: "tab:purple"
  H:
    scenario: "SSP3 - High Emissions"
    model: "GCAM 8s"
    color: "tab:red"
  HL:
    scenario: "SSP5 - Medium-Low Emissions_a"
    model: "WITCH 6.0"
    color: "tab:brown"
  HL-CF:
    scenario: "SSP5 - Medium-Low Emissions_a"
    model: "WITCH 6.0"
    color: "#FF6600"

# --- Fossil CO2 storyline parameters ---
fossil_evolution:
  VL:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]
  LN:
    type: ECS
    params: [2120, -24000.0, 2200, 2300, 20, 20]
  L:
    type: ECS
    params: [2160, null, 2160, 2260, 40, 20]
  ML:
    type: ECS
    params: [2150, -13000.0, 2230, 2300, 20, 20]
  M:
    type: CS
    params: [2100, 2240, 20, 20]
  H:
    type: ECS
    params: [2150, null, 2175, 2300, 20, 20]
  HL:
    type: ECS
    params: [2150, -22000.0, 2200, 2300, 20, 20]
  HL-CF:
    type: ECS
    params: [2100, 0, 2100, 2300, 20, 20]  # initial guess; exp_targ & sig_start optimized, sig_end fixed at 2300

# --- Removal strategy ---
removal_strategy:
  VL:
    type: NEG
    params: [100, 60]
  LN:
    type: NEG
    params: [50, 100]
  L:
    type: NEG
    params: [50, 50]
  ML:
    type: NEG
    params: [100, 0]
  M:
    type: POS
    params: []
  H:
    type: POS
    params: []
  HL:
    type: NEG
    params: [80, 20]
  HL-CF:
    type: NEG
    params: [80, 20]

# --- Non-CO2 global targets ---
# Bare number = target only (default sigmoid_shift=40, sigmoid_len=50, branch at scenario_end_year)
# Dict = full control: {target, sigmoid_shift, sigmoid_len, branch_year}
# null = follow source scenario (no extension override)
non_co2_targets:
  "Emissions|CH4":
    VL: 95.0
    LN: 150.0
    L: 95.0
    ML: 120.0
    M: 450.0
    H: 520.0
    HL: 110.0
    HL-CF:
      target: 200.0
      branch_year: 2080
  "Emissions|Sulfur":
    VL: 20.0
    LN: 10.0
    L: null
    ML: 20.0
    M: 20.0
    H: 50.0
    HL: 10.0
    HL-CF:
      target: 10.0
      branch_year: 2080

# --- Optimization settings ---
# Scenarios with optimize: true will have their fossil_evolution params
# tuned to meet a temperature target via FaIR.
optimization:
  HL-CF:
    enabled: true
    departure_year: 2080
    n_configs: 1
    # Optimize these fossil_evolution params (indices into params list)
    # For ECS: [exp_end, exp_targ, sig_start, sig_end, roll_in, roll_out]
    optimize_params: [exp_targ, sig_start]
    fixed_params:
      sig_end: 2300
    # Bounds for optimization
    bounds:
      exp_targ: [5000.0, 15000.0]
      sig_start: [2120, 2200]
    # Temperature objective: hold at departure_year level
    objective: plateau_at_departure
