# WIEMIP Extension Configuration
# ===============================
# Extends ScenarioMIP default with a counterfactual LN scenario (LN-CF)
# where emissions are adjusted so that FaIR median temperatures hold steady
# at the peak level (around 2080).

name: WIEMIP
description: >
  ScenarioMIP markers plus HL-CF counterfactual.
  HL-CF departs from the HL pathway at 2080 and is optimized to hold
  FaIR median temperature constant at the 2080 peak level.

# --- Time range constants ---
time:
  historical_start_year: 1900
  future_start_year: 2023.0
  scenario_end_year: 2100
  extensions_end_year: 2500

# --- Flags ---
flags:
  make_plots: false
  dump_csvs: true

# --- Scenario-to-model mapping ---
scenario_model_match:
  VL:
    scenario: "SSP1 - Very Low Emissions"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#16188F"
  VL-CF:
    scenario: "SSP1 - Very Low Emissions"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#16188F"
  LN:
    scenario: "SSP2 - Low Overshoot_a"
    model: "AIM 3.0"
    color: "#22e5db"
  L:
    scenario: "SSP2 - Low Emissions"
    model: "MESSAGEix-GLOBIOM-GAINS 2.1-M-R12"
    color: "#20A359"
  ML:
    scenario: "SSP2 - Medium-Low Emissions"
    model: "COFFEE 1.6"
    color: "#916326"
  ML-CF:
    scenario: "SSP2 - Medium-Low Emissions"
    model: "COFFEE 1.6"
    color: "#916326"
  M:
    scenario: "SSP2 - Medium Emissions"
    model: "IMAGE 3.4"
    color: "#fc7b03"
  H:
    scenario: "SSP3 - High Emissions"
    model: "GCAM 8s"
    color: "#a41212"
  HL:
    scenario: "SSP5 - Medium-Low Emissions_a"
    model: "WITCH 6.0"
    color: "#E744F6"
  HL-CF:
    scenario: "SSP5 - Medium-Low Emissions_a"
    model: "WITCH 6.0"
    color: "#FF6600"

# --- Fossil CO2 storyline parameters ---
fossil_evolution:
  VL:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]
  VL-CF:
    type: ECS
    params: [2048, 3300, 2048, 2450, 20, 20]
  LN:
    type: ECS
    params: [2120, -24000.0, 2200, 2300, 20, 20]
  L:
    type: ECS
    params: [2160, null, 2160, 2260, 40, 20]
  ML:
    type: ECS
    params: [2150, -13000.0, 2230, 2300, 20, 20]
  ML-CF:
    type: ECS
    params: [2092, 2000, 2092, 3200, 20, 20] 
  M:
    type: CS
    params: [2100, 2240, 20, 20]
  H:
    type: ECS
    params: [2150, null, 2175, 2300, 20, 20]
  HL:
    type: ECS
    params: [2150, -22000.0, 2200, 2300, 20, 20]
  HL-CF:
    type: ECS
    params: [2125, 6200, 2125, 2290, 20, 20]  # initial guess; exp_targ & sig_start optimized, sig_end fixed at 2300

# --- Removal strategy ---
removal_strategy:
  VL:
    type: NEG
    params: [100, 60]
  VL-CF:
    type: NEG
    params: [100, 60]
  LN:
    type: NEG
    params: [50, 100]
  L:
    type: NEG
    params: [50, 50]
  ML:
    type: NEG
    params: [100, 0]
  ML-CF:
    type: NEG
    params: [100, 0]
  M:
    type: POS
    params: []
  H:
    type: POS
    params: []
  HL:
    type: NEG
    params: [80, 20]
  HL-CF:
    type: NEG
    params: [80, 20]

# --- Non-CO2 global targets ---
# Bare number = target only (default sigmoid_shift=40, sigmoid_len=50, branch at scenario_end_year)
# Dict = full control: {target, sigmoid_shift, sigmoid_len, branch_year}
# null = follow source scenario (no extension override)
non_co2_targets:
  "Emissions|CH4":
    VL: 95.0
    LN: 150.0
    L: 95.0
    ML: 120.0
    M: 450.0
    H: 520.0
    HL: 110.0
    HL-CF:
      target: 200.0
      branch_year: 2080
  "Emissions|Sulfur":
    VL: 20.0
    LN: 10.0
    L: null
    ML: 20.0
    M: 20.0
    H: 50.0
    HL: 10.0
    HL-CF:
      target: 10.0
      branch_year: 2080

# --- Optimization settings ---
# Scenarios with optimize: true will have their fossil_evolution params
# tuned to meet a temperature target via FaIR.
optimization:
  HL-CF:
    enabled: true
    # Pinned published parameters (optimizer bypassed). HL-CF's published run
    # FAILED (final_cost=1e6): differential_evolution fell back to its seed-42
    # initial guess. Pinned to reproduce the published output exactly; NOT a
    # true optimum.
    fixed_result:
      exp_targ: 8035.289100315416
      sig_start: 2107.6508492764788
      sig_end: 2200.7289858186327
      departure_year: 2080
      target_temp: 2.825050895269616
      final_cost: 1000000.0
      success: true
      note: "Published seed-42 fallback from failed optimisation; pinned for reproducibility, not a true optimum."
    target_year: peak
    departure_year: 2073
    departure_offset: -15
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    bounds:
      exp_targ: [5000.0, 15000.0]
      sig_start: [2100, 2200]
      sig_end: [2100, 3000]
  ML-CF:
    enabled: true
    # Pinned published parameters (optimizer bypassed). Published run was a real
    # but unconverged optimisation (final_cost=31.88, "max iterations exceeded").
    # Pinned to reproduce the published output exactly.
    fixed_result:
      exp_targ: -655.6391087097682
      sig_start: 2101.879838660313
      sig_end: 2154.201395270703
      departure_year: 2090
      target_temp: 2.269308148086313
      final_cost: 31.876899502891458
      success: false
      note: "Published (unconverged) optimiser result; pinned for reproducibility."
    target_year: peak
    departure_year: 2060
    departure_offset: -15
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    bounds:
      exp_targ: [-10000.0, 5000.0]
      sig_start: [2040, 2200]
      sig_end: [2100, 3000]
  VL-CF:
    enabled: true
    # Pinned published parameters (optimizer bypassed). Published run was a real
    # but unconverged optimisation (final_cost=26.20, "max iterations exceeded").
    # Pinned to reproduce the published output exactly.
    fixed_result:
      exp_targ: -3374.0185875949123
      sig_start: 2067.868405220457
      sig_end: 2068.699199748727
      departure_year: 2050
      target_temp: 1.7111679842615657
      final_cost: 26.204053277061746
      success: false
      note: "Published (unconverged) optimiser result; pinned for reproducibility."
    target_year: peak
    departure_year: peak
    departure_offset: -15
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    bounds:
      exp_targ: [-5000.0, 5000.0]
      sig_start: [2040, 2200]
      sig_end: [2100, 3000]