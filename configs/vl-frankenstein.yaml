# ScenarioMIP Default Extension Configuration
# =============================================
# This is the baseline configuration for the FLEX extension pipeline,
# reproducing the standard ScenarioMIP marker scenario extensions.
#
# To create a custom ensemble, copy this file and modify the parameters.

name: vl-frankenstein
description: >
  Frankenstein-style scenario extensions for the SSP1-1.9 (VL) marker scenario,
  harmonised from 2015 and using different fossil fuel and possibly also AFOLU
  targets. The -hold variants branch at 2050 and are optimized to hold
  FaIR median temperature constant at the 2050 level.

# --- Time range constants ---
time:
  historical_start_year: 1900
  future_start_year: 2015.0
  scenario_end_year: 2100
  extensions_end_year: 2500

# --- Flags ---
flags:
  make_plots: false
  dump_csvs: true

# --- Plot colors per marker (for FaIR result visualizations) ---
plot_colors:
  VL-fossil-frankenstein: "#2196F3"
  VL-fossil-frankenstein-zero-afolu: "#FF9800"
  VL-fossil-frankenstein-hold: "#9C27B0"
  VL-fossil-frankenstein-zero-afolu-hold: "#E91E63"

# --- Scenario-to-model mapping ---
# Each marker maps to: [scenario_name, model_name, plot_color]
scenario_model_match:
  VL-fossil-frankenstein:
    scenario: "SSP1 - Very Low Emissions fossil frankenstein"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#2196F3"
  VL-fossil-frankenstein-zero-afolu:
    scenario: "SSP1 - Very Low Emissions fossil frankenstein AFOLU zero"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#FF9800"
  VL-fossil-frankenstein-hold:
    scenario: "SSP1 - Very Low Emissions fossil frankenstein"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#9C27B0"
  VL-fossil-frankenstein-zero-afolu-hold:
    scenario: "SSP1 - Very Low Emissions fossil frankenstein AFOLU zero"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#E91E63"

# --- Fossil CO2 storyline parameters ---
# Storyline types:
#   CS  (Constant-Sigmoid):  [type, stop_const, end_sig, roll_in, roll_out]
#   ECS (Exp-Constant-Sigmoid): [type, exp_end, exp_targ, sig_start, sig_end, roll_in, roll_out]
#   CSCS (Double sigmoid):  [type, stop_const, sig_targ, end_sig1, start_sig2, end_sig2, roll_in, roll_out]
#
# exp_targ=null means linear interpolation instead of exponential decay
fossil_evolution:
  VL-fossil-frankenstein:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]
  VL-fossil-frankenstein-zero-afolu:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]
  VL-fossil-frankenstein-hold:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # initial guess; optimized
  VL-fossil-frankenstein-zero-afolu-hold:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # initial guess; optimized

# --- Removal strategy ---
# NEG: [type, decay_timescale, offset] — gross positive decays, CDR as residual
# POS: [type] — CDR constant, gross positive adjusts to follow fossil
removal_strategy:
  VL-fossil-frankenstein:
    type: NEG
    params: [100, 60]
  VL-fossil-frankenstein-zero-afolu:
    type: NEG
    params: [100, 60]
  VL-fossil-frankenstein-hold:
    type: NEG
    params: [100, 60]
  VL-fossil-frankenstein-zero-afolu-hold:
    type: NEG
    params: [100, 60]

# --- Non-CO2 global targets ---
# Bare number = target with default sigmoid (shift=40, len=50, branch at scenario_end_year)
# Dict = full control: {target, sigmoid_shift, sigmoid_len, branch_year}
# null = auto-calculate target from data (original ScenarioMIP behavior)
# Scenario not listed = skip extension, follow source scenario
non_co2_targets:
  "Emissions|CH4":
    VL-fossil-frankenstein: 95.0
    VL-fossil-frankenstein-zero-afolu: 95.0
    # -hold variants not listed: they follow the source scenario's CH4
  "Emissions|Sulfur":
    VL-fossil-frankenstein: 20.0
    VL-fossil-frankenstein-zero-afolu: 20.0
    # -hold variants not listed: they follow the source scenario's sulfur

# --- Data sources (paths relative to data/) ---
# Overrides the default CSVs when loading input data.
data_sources:
  scenarios_global:
    - "vl-extensions-inputs/VL_frankenstein-full.csv"
    - "vl-extensions-inputs/VL_frankenstein_AFOLU-full.csv"
  scenarios_regional: "vl-extensions-inputs/VL_frankenstein-FFCO2-sector_region.csv"
  # AFOLU-zero shares the same fossil CO2 regional breakdown as the base frankenstein
  regional_scenario_fallback:
    "SSP1 - Very Low Emissions fossil frankenstein AFOLU zero": "SSP1 - Very Low Emissions fossil frankenstein"

# --- Forcing scenario mapping ---
# Maps marker names to scenario IDs in volcanic_solar.csv
forcing_scenario:
  VL-fossil-frankenstein: VL
  VL-fossil-frankenstein-zero-afolu: VL
  VL-fossil-frankenstein-hold: VL
  VL-fossil-frankenstein-zero-afolu-hold: VL

# --- Optimization settings ---
# The -hold variants are optimized to hold FaIR median temperature
# constant at the peak level from the source scenario.
# target_year: "peak" finds the peak temperature from the baseline run.
# departure_year: "peak" + departure_offset: -15 starts the trajectory
# modification 15 years before the peak, giving a smooth transition.
# Only fossil CO2 is optimized; methane is left untouched.
optimization:
  VL-fossil-frankenstein-hold:
    enabled: true
    target_year: peak
    departure_year: peak
    departure_offset: -15
    n_configs: 10
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    bounds:
      exp_targ: [-5000.0, 5000.0]
      sig_start: [2040, 2200]
      sig_end: [2100, 3000]
  VL-fossil-frankenstein-zero-afolu-hold:
    enabled: true
    target_year: peak
    departure_year: peak
    departure_offset: -15
    n_configs: 10
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    bounds:
      exp_targ: [-5000.0, 5000.0]
      sig_start: [2040, 2200]
      sig_end: [2100, 3000]
