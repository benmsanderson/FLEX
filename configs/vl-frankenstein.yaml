# ScenarioMIP Default Extension Configuration
# =============================================
# This is the baseline configuration for the FLEX extension pipeline,
# reproducing the standard ScenarioMIP marker scenario extensions.
#
# To create a custom ensemble, copy this file and modify the parameters.

name: vl-frankenstein
description: >
  Frankenstein-style scenario extensions for the SSP1-1.9 (VL) marker scenario,
  harmonised from 2015 and using different fossil fuel and possibly also AFOLU
  targets. The -hold variants branch at 2050 and are optimized to hold
  FaIR median temperature constant at the 2050 level.

# --- Time range constants ---
time:
  historical_start_year: 1900
  future_start_year: 2015.0
  scenario_end_year: 2100
  extensions_end_year: 2500

# --- Flags ---
flags:
  make_plots: True
  dump_csvs: True
  read_non_co2_from_csv: True
  read_afolu_from_csv: True
  # Produce a regionalised/sectorised extended_scenarios CSV for the
  # optimised counterfactual markers (run in 5196 after optimisation).
  regionalize_optimised_output: True

# --- Scenario-to-model mapping ---
# Each marker maps to: [scenario_name, model_name, plot_color]
scenario_model_match:
  VL-fossil-frankenstein:
    scenario: "SSP1 - Very Low Emissions Ref1p5"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#2196F3"
  VL-fossil-frankenstein-hold:
    scenario: "SSP1 - Very Low Emissions Ref1p5"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#9C27B0"
  VL-fossil-frankenstein-1p5:
    scenario: "SSP1 - Very Low Emissions Ref1p5"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#00A651"
  VL-fossil-frankenstein-1p6:
    scenario: "SSP1 - Very Low Emissions Ref1p5"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#FF9800"
  VL-fossil-frankenstein-1p5x:
    scenario: "SSP1 - Very Low Emissions Ref1p5"
    model: "REMIND-MAgPIE 3.5-4.11"
    color: "#009688"
  # VL-fossil-frankenstein-zero-afolu:
  #   scenario: "SSP1 - Very Low Emissions fossil frankenstein AFOLU zero"
  #   model: "REMIND-MAgPIE 3.5-4.11"
  #   color: "#FF9800"
  # VL-fossil-frankenstein-zero-afolu-hold:
  #   scenario: "SSP1 - Very Low Emissions fossil frankenstein AFOLU zero"
  #   model: "REMIND-MAgPIE 3.5-4.11"
  #   color: "#E91E63"

# --- Fossil CO2 storyline parameters ---
# Storyline types:
#   CS  (Constant-Sigmoid):  [type, stop_const, end_sig, roll_in, roll_out]
#   ECS (Exp-Constant-Sigmoid): [type, exp_end, exp_targ, sig_start, sig_end, roll_in, roll_out]
#   CSCS (Double sigmoid):  [type, stop_const, sig_targ, end_sig1, start_sig2, end_sig2, roll_in, roll_out]
#
# exp_targ=null means linear interpolation instead of exponential decay
fossil_evolution:
  VL-fossil-frankenstein:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]
  VL-fossil-frankenstein-zero-afolu:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]
  VL-fossil-frankenstein-hold:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # initial guess; optimized
  VL-fossil-frankenstein-1p5:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # placeholder; overwritten by fixed_result
  VL-fossil-frankenstein-1p6:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # placeholder; overwritten by fixed_result
  VL-fossil-frankenstein-1p5x:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # placeholder; overwritten by fixed_result
  VL-fossil-frankenstein-zero-afolu-hold:
    type: ECS
    params: [2200, -3500.0, 2450, 2500, 20, 20]  # initial guess; optimized

# --- Removal strategy ---
# NEG: [type, decbay_timescale, offset] — gross positive decays, CDR as residual
# POS: [type] — CDR constant, gross positive adjusts to follow fossil
removal_strategy:
  VL-fossil-frankenstein:
    type: NEG
    params: [100, 60]
  VL-fossil-frankenstein-zero-afolu:
    type: NEG
    params: [100, 60]
  VL-fossil-frankenstein-CF:
    type: NEG
    params: [100, 60]
  VL-fossil-frankenstein-zero-afolu-CF:
    type: NEG
    params: [100, 60]

# --- Non-CO2 global targets ---
# Bare number = target with default sigmoid (shift=40, len=50, branch at scenario_end_year)
# Dict = full control: {target, sigmoid_shift, sigmoid_len, branch_year}
# null = auto-calculate target from data (original ScenarioMIP behavior)
# Scenario not listed = skip extension, follow source scenario
non_co2_targets:
  "Emissions|CH4":
    VL-fossil-frankenstein: 95.0
    VL-fossil-frankenstein-zero-afolu: 95.0
    # -hold variants not listed: they follow the source scenario's CH4
  "Emissions|Sulfur":
    VL-fossil-frankenstein: 20.0
    VL-fossil-frankenstein-zero-afolu: 20.0
    # -hold variants not listed: they follow the source scenario's sulfur

# --- Data sources (paths relative to data/) ---
# Overrides the default CSVs when loading input data.
data_sources:
  scenarios_global:
    - "vl-extensions-inputs/VL_Ref1p5_260616.csv"
    - "vl-extensions-inputs/VL_Ref1p5_260616.csv"
  scenarios_regional: "vl-extensions-inputs/VL_Ref1p5_260616.csv"
  # AFOLU-zero shares the same fossil CO2 regional breakdown as the base frankenstein
  regional_scenario_fallback:
    "SSP1 - Very Low Emissions Ref1p5 hold": "SSP1 - Very Low Emissions Ref1p5"

# --- Forcing scenario mapping ---
# Maps marker names to scenario IDs in volcanic_solar.csv
forcing_scenario:
  VL-fossil-frankenstein: VL
  VL-fossil-frankenstein-zero-afolu: VL
  VL-fossil-frankenstein-hold: VL
  VL-fossil-frankenstein-1p5: VL
  VL-fossil-frankenstein-1p6: VL
  VL-fossil-frankenstein-1p5x: VL
  VL-fossil-frankenstein-zero-afolu-hold: VL

# --- Concentrations file (optional) ---
# When set, all non-CO2 GHG species (CH4, N2O, F-gases, halocarbons, etc.)
# are run in concentration-driven mode using this file.  Only fossil CO2
# (FFI + AFOLU) remains emissions-driven.
# Path is relative to the data/ directory.
# concentrations_file: "path/to/concentrations_1750-2500.csv"
#
# Single-scenario (SSP1 Very Low Emissions) extract of the published
# concentration master. The loader selects concentrations by a `scenario`
# column; the multi-scenario master (`concentrations_1750-2500.csv`, 7
# `long_scenario` values) cannot be resolved to VL and breaks the run, so we
# point at the VL-only extract, which reproduces the published output exactly.
concentrations_file: fair-inputs/concentrations_1750-2500_VL.csv

# --- Optimization settings ---
# The -hold variants are optimized to hold FaIR median temperature
# constant at the peak level from the source scenario.
# target_year: "peak" finds the peak temperature from the baseline run.
# departure_year: "peak" + departure_offset: -15 starts the trajectory
# modification 15 years before the peak, giving a smooth transition.
# Only fossil CO2 is optimized; methane is left untouched.
optimization:
  VL-fossil-frankenstein-hold:
    enabled: true
    # --- Pinned published parameters (optimizer bypassed) ---
    # The published -hold optimization FAILED: every FaIR evaluation raised
    # ("Scenario '_opt_0' not found in concentrations file"), so
    # differential_evolution returned its seed-42 initial guess unchanged
    # (final_cost=1e6). These values reproduce the published output exactly and
    # are pinned here because the branch's optimiser now converges elsewhere.
    # This scenario is NOT the result of a successful optimisation.
    fixed_result:
      exp_targ: 1517.6445501577082
      sig_start: 2040.71118898707
      sig_end: 2116.7881643031055
      departure_year: 2032
      target_temp: 1.6989185926711297
      final_cost: 1000000.0
      success: true
      note: "Published seed-42 fallback from failed optimisation (2026-06-30); pinned for reproducibility, not a true optimum."
    # Optimiser settings below are retained for provenance but unused while
    # fixed_result is present. Remove fixed_result to re-run the optimiser.
    target_year: peak
    departure_year: peak
    departure_offset: -15
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    bounds:
      exp_targ: [0.0, 5000.0]
      sig_start: [2030, 2170]
      sig_end: [2100, 2250]
  VL-fossil-frankenstein-1p5:
    enabled: true
    # --- Hand-tuned 1.5 C hold (pinned) ---
    # Departs the base at 2037 and holds total CO2 at a sustained positive level
    # so the FaIR median settles flat at ~1.5 C above 1850-1900 (2100-2500 all
    # within ~1.50-1.52 C). Peaks ~1.64 C vs 1850-1900 around 2051.
    # target_temp = 1.5795 K = 1.5 C vs 1850-1900.
    fixed_result:
      exp_targ: 3370.0
      sig_start: 2045.0
      sig_end: 2600.0
      departure_year: 2037
      target_temp: 1.5795
      final_cost: 3.0887085042221676
      success: true
      note: "Hand-tuned 1.5 C flat hold (2026-08); holds steady at ~1.5 C vs 1850-1900 after 2100."
    # Optimiser settings retained for provenance; unused while fixed_result set.
    target_temp_abs: 1.5795
    departure_year: 2037
    departure_offset: 0
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    overshoot_weight: 30
    bounds:
      exp_targ: [-5000.0, 5000.0]
      sig_start: [2025, 2100]
      sig_end: [2060, 3500]
  VL-fossil-frankenstein-1p6:
    enabled: true
    # --- Hand-tuned ~1.6 C ("hold near the peak") variant (pinned) ---
    # Companion to -1p5, offered so colleagues can choose the hold level.
    # Departs at 2034 and holds total CO2 higher (exp_targ=5300) so the FaIR
    # median sits roughly at the base peak level (~1.6 C vs 1850-1900),
    # creeping to ~1.67 C by 2300 then easing.
    fixed_result:
      exp_targ: 5300.0
      sig_start: 2070.0
      sig_end: 2480.0
      departure_year: 2034
      target_temp: 1.5795
      final_cost: 3.0887085042221676
      success: true
      note: "Hand-tuned ~1.6 C hold-near-peak (2026-08); companion choice to -1p5."
    # Optimiser settings retained for provenance; unused while fixed_result set.
    target_temp_abs: 1.6795
    departure_year: 2034
    departure_offset: 0
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    overshoot_weight: 30
    bounds:
      exp_targ: [-5000.0, 8000.0]
      sig_start: [2025, 2150]
      sig_end: [2060, 3500]
  VL-fossil-frankenstein-1p5x:
    enabled: true
    # --- Hand-tuned aggressive-early, low-overshoot 1.5 C hold (pinned) ---
    # Departs the base at 2016 and cuts total CO2 hard (38 -> ~4 Gt/yr by 2030),
    # roughly halving the peak overshoot (peak ~1.57-1.58 C vs 1850-1900) while
    # still holding near 1.5 C long term. A more aggressive near-term companion
    # to -1p5 for colleagues who want a smaller overshoot.
    fixed_result:
      exp_targ: 4300.0
      sig_start: 2030.0
      sig_end: 2500.0
      departure_year: 2016
      target_temp: 1.5795
      final_cost: 3.0887085042221676
      success: true
      note: "Hand-tuned aggressive-early 1.5 C hold (2026-08); departs 2016, smaller overshoot than -1p5."
    # Optimiser settings retained for provenance; unused while fixed_result set.
    target_temp_abs: 1.5795
    departure_year: 2016
    departure_offset: 0
    n_configs: 50
    optimize_params: [exp_targ, sig_start, sig_end]
    fixed_params: {}
    overshoot_weight: 30
    bounds:
      exp_targ: [-5000.0, 8000.0]
      sig_start: [2020, 2100]
      sig_end: [2060, 3500]
